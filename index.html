<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Construcción</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 90%;
            padding: 20px;
        }
        .logo {
            max-width: 200px;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        p {
            font-size: 1.1rem;
            color: #7f8c8d;
        }
        .divider {
            width: 50px;
            height: 3px;
            background-color: #3498db;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Reemplaza la URL abajo con tu logo -->
        <img src="./logo.jpg" alt="Logo" class="logo">
        <h1>Sitio en Construcción</h1>
        <div class="divider"></div>
        <p>Estamos trabajando en algo increíble. Vuelve pronto.</p>
    </div>
</body>
</html>
